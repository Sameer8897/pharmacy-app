services:
  - type: web
    name: pharmacy-api
    runtime: docker
    rootDir: backend
    dockerContext: .
    dockerfilePath: ./Dockerfile
    region: singapore
    plan: free
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: postgres
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGINS
        value: https://pharmacy-web-stos.onrender.com

  - type: web
    name: pharmacy-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeploy: true
    envVars:
      - key: VITE_API_URL
        value: https://pharmacy-api-ahtx.onrender.com/api
